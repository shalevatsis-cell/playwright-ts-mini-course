# GitHub Actions workflow for running Playwright tests
# This workflow automates end-to-end testing on every push and pull request
name: Playwright Tests

# Trigger conditions - defines when this workflow should run
on:
  # Run on push events to main or master branches
  push:
    branches: [ main, master ]
  # Run on pull request events targeting main or master branches
  pull_request:
    branches: [ main, master ]

# Job configuration for running tests
jobs:
  test:
    # Set a 60-minute timeout to prevent jobs from running indefinitely
    timeout-minutes: 60
    # Run tests on the latest Ubuntu Linux environment
    runs-on: ubuntu-latest
    # Define the sequence of steps to execute in this job
    steps:
    # Step 1: Check out the repository code so we can run tests on it
    - uses: actions/checkout@v4
    # Step 2: Set up Node.js runtime environment with the latest LTS version
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    # Step 3: Install project dependencies using npm ci (clean install for CI/CD)
    - name: Install dependencies
      run: npm ci
    # Step 4: Install Playwright browser binaries (Chromium, Firefox, WebKit)
    # The --with-deps flag also installs system dependencies required by the browsers
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    # Step 5: Execute all Playwright tests
    - name: Run Playwright tests
      run: npx playwright test
      env:
        standardUser: ${{ secrets.STANDARDUSER }}
        lockedOutUser: ${{ secrets.LOCKEDOUTUSER }}
        problemUser: ${{ secrets.PROBLEMUSER }}
        performanceGlitchUser: ${{ secrets.PERFORMANCEGLITCHUSER }}
        correctPassword: ${{ secrets.CORRECTPASSWORD }}
    # Step 6: Upload test artifacts for review (runs even if tests fail)
    # This uploads the Playwright HTML report for viewing test results and traces
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        # Keep artifacts for 30 days before automatic deletion
        retention-days: 30
